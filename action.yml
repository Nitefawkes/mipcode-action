name: MipCode PR Caller Check
description: Find Python callers a pull request missed when it changed a function contract.
author: Nitefawkes
branding:
  icon: git-pull-request
  color: blue

inputs:
  root:
    description: Directory within the checkout to analyze.
    default: '.'
  base-ref:
    description: Optional Git revision to compare against. Pull requests select their baseline automatically.
    default: ''
  fail-on-findings:
    description: Set to true to make reported findings fail the job.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python for MipCode
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        update-environment: 'false'
    - name: Check Python callers
      shell: bash
      env:
        MIPCODE_PYTHON: ${{ steps.python.outputs.python-path }}
        MIPCODE_ROOT: ${{ inputs.root }}
        MIPCODE_BASE_REF: ${{ inputs.base-ref }}
        MIPCODE_FAIL: ${{ inputs.fail-on-findings }}
        MIPCODE_PR_BASE: ${{ github.event.pull_request.base.sha }}
        MIPCODE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: '"$MIPCODE_PYTHON" -I "$GITHUB_ACTION_PATH/run_action.py"'
